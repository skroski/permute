<!-- ofertas.component.html -->
<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Ofertas</h1>
  <ul class="mb-4">
    <li *ngFor="let oferta of ofertas" class="border-b py-2">
      <h2 class="text-xl">{{ oferta.titulo }}</h2>
      <p>{{ oferta.descricao }}</p>
      <p>Tipo: {{ oferta.tipo }}</p>
      <p>Valor de Referência: {{ oferta.valorReferencia }}</p>
      <p>Categorias: {{ oferta.categorias.join(', ') }}</p>
      <button
        class="bg-red-500 text-white px-2 py-1 rounded"
        (click)="deletarOferta(oferta.id)"
      >
        Deletar
      </button>
      <button
        class="bg-blue-500 text-white px-2 py-1 rounded ml-2"
        (click)="atualizarOferta(oferta)"
      >
        Atualizar
      </button>
    </li>
  </ul>

  <h3 class="text-xl font-semibold mb-2">Adicionar Nova Oferta</h3>
  <form
    [formGroup]="ofertaForm"
    (ngSubmit)="adicionarOferta()"
    class="space-y-4"
  >
    <div>
      <label for="titulo" class="block text-sm font-medium text-gray-700"
        >Título</label
      >
      <input
        id="titulo"
        formControlName="titulo"
        type="text"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      />
    </div>

    <div>
      <label for="descricao" class="block text-sm font-medium text-gray-700"
        >Descrição</label
      >
      <input
        id="descricao"
        formControlName="descricao"
        type="text"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      />
    </div>

    <div>
      <label for="tipo" class="block text-sm font-medium text-gray-700"
        >Tipo</label
      >
      <input
        id="tipo"
        formControlName="tipo"
        type="text"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      />
    </div>

    <div>
      <label
        for="valorReferencia"
        class="block text-sm font-medium text-gray-700"
        >Valor de Referência</label
      >
      <input
        id="valorReferencia"
        formControlName="valorReferencia"
        type="number"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      />
    </div>

    <div>
      <label for="categorias" class="block text-sm font-medium text-gray-700"
        >Categorias</label
      >
      <textarea
        id="categorias"
        formControlName="categorias"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      ></textarea>
    </div>

    <div>
      <label for="usuarioId" class="block text-sm font-medium text-gray-700"
        >Usuário</label
      >
      <select
        id="usuarioId"
        formControlName="usuarioId"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm"
      >
        <option *ngFor="let usuario of usuarios" [value]="usuario.id">
          {{ usuario.nome }}
        </option>
      </select>
    </div>

    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">
      Adicionar Oferta
    </button>
  </form>
</div>
